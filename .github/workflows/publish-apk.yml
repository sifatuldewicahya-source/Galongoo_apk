name: Publish Prebuilt Debug APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - apk-distribution/app-debug.apk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Validate and Publish Debug APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate prebuilt APK and checksum
        id: validate_apk
        run: |
          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Missing $APK_PATH"
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::$APK_PATH is empty"
            exit 1
          fi

          if [ ! -f "$SHA_PATH" ]; then
            echo "::error::Missing $SHA_PATH"
            exit 1
          fi

          (cd apk-distribution && sha256sum -c app-debug.apk.sha256)
          unzip -tq "$APK_PATH"

          APK_SIZE_BYTES=$(wc -c < "$APK_PATH" | tr -d ' ')
          APK_SIZE_HUMAN=$(du -h "$APK_PATH" | cut -f1)
          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')

          echo "apk_size_bytes=$APK_SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "apk_size_human=$APK_SIZE_HUMAN" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with prebuilt APK
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="GalonDekat Debug APK (Build #${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT})"
          APK_SHA256="${{ steps.validate_apk.outputs.apk_sha256 }}"
          APK_SIZE_HUMAN="${{ steps.validate_apk.outputs.apk_size_human }}"
          APK_SIZE_BYTES="${{ steps.validate_apk.outputs.apk_size_bytes }}"

          RELEASE_NOTES=$(printf 'Prebuilt Android debug APK compiled in Google AI Studio.\n\n- **Asset:** `app-debug.apk`\n- **Size:** %s (%s bytes)\n- **SHA-256:** `%s`\n' "$APK_SIZE_HUMAN" "$APK_SIZE_BYTES" "$APK_SHA256")

          RELEASE_URL=$(gh release create "$RELEASE_TAG" \
            "apk-distribution/app-debug.apk#app-debug.apk" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest)

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        env:
          RELEASE_TAG: ${{ steps.create_release.outputs.release_tag }}
          RELEASE_URL: ${{ steps.create_release.outputs.release_url }}
          APK_SIZE_HUMAN: ${{ steps.validate_apk.outputs.apk_size_human }}
          APK_SIZE_BYTES: ${{ steps.validate_apk.outputs.apk_size_bytes }}
          APK_SHA256: ${{ steps.validate_apk.outputs.apk_sha256 }}
        run: |
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          {
            echo "## Prebuilt Debug APK Published"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Release Tag | \`${RELEASE_TAG}\` |"
            echo "| APK Size | ${APK_SIZE_HUMAN} (${APK_SIZE_BYTES} bytes) |"
            echo "| SHA-256 | \`${APK_SHA256}\` |"
            echo "| GitHub Release Page | ${RELEASE_URL} |"
            echo "| Direct Latest APK URL | ${DIRECT_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
